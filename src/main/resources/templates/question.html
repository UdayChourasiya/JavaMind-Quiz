```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Quiz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .quiz-container {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .question-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 30px;
        }

        .question-number {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .question {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.6;
            color: #1e293b;
        }

        .options {
            display: flex;
            gap: 18px;
            margin-bottom: 30px;
        }

        .option {
            flex: 1;
        }

        .option input {
            display: none;
        }

        .option label {
            display: block;
            text-align: center;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            color: #334155;
            font-weight: 600;
            background: white;
            transition: all 0.25s ease;
        }

        .option label:hover {
            border-color: #6366f1;
            background: #eef2ff;
            transform: translateY(-2px);
        }

        .option input:checked + label {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .next-btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.35);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 25px;
            }

            .options {
                flex-direction: column;
            }

            .question {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <div class="header">
        <h1>Java Knowledge Quiz</h1>
        <p>Test your understanding of Java concepts</p>
    </div>

    <div class="question-box">

        <span class="question-number">
            Q.<span th:text="${cq.qno}"></span>
        </span>

        <div class="question" th:text="${cq.question}">
        </div>

    </div>

    <form action="next">

        <div class="options">

            <div class="option">
                <input type="radio"
                       id="true"
                       value="true"
                       name="userans">

                <label for="true">True</label>
            </div>

            <div class="option">
                <input type="radio"
                       id="false"
                       value="false"
                       name="userans">

                <label for="false">False</label>
            </div>

        </div>

        <input class="next-btn"
               type="submit"
               value="Next">

    </form>

    <div class="footer">
        Java Assessment Platform
    </div>

</div>

</body>
</html>
```
