<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Result</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            padding: 50px 25px;
            color: #1e293b;
        }

        .result-container {
            max-width: 1100px;
            margin: auto;
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
            background: white;
        }

        th {
            background: #1e293b;
            color: white;
            padding: 18px 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
        }

        td {
            padding: 17px 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            color: #334155;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fafc;
        }

        td:first-child {
            font-weight: 700;
            color: #4f46e5;
        }

        .total-box {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 25px;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            border: 1px solid #ddd6fe;
            border-radius: 16px;
        }

        .total-label {
            font-size: 17px;
            font-weight: 700;
            color: #334155;
        }

        .total-score {
            font-size: 28px;
            font-weight: 800;
            color: #4f46e5;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .result-container {
                padding: 22px;
            }

            .header h1 {
                font-size: 25px;
            }

            .total-box {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="result-container">

    <div class="header">
        <h1>Quiz Result</h1>
        <p>Review your answers and performance</p>
    </div>

    <div class="table-wrapper">

        <table>

            <tr>
                <th>Q.No.</th>
                <th>Question</th>
                <th>Answer</th>
                <th>User Answer</th>
                <th>Total</th>
            </tr>

            <tr th:each="q:${session.list}">

                <td th:text="${q.qno}"></td>

                <td th:text="${q.question}"></td>

                <td th:text="${q.ans}"></td>

                <td th:text="${q.userAns}"></td>

                <td th:text="${q.marks}"></td>

            </tr>

        </table>

    </div>

    <div class="total-box">

        <span class="total-label">
            Total Correct Answer Number :
        </span>

        <span class="total-score"
              th:text="${total}">
        </span>

    </div>

    <div class="footer">
        Java Assessment Platform
    </div>

</div>

</body>
</html>
